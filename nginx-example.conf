server {
    listen 443 ssl http2;
    server_name cile-keycloak.curricume.com;

    ssl_certificate     /etc/letsencrypt/live/cile.curricume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cile.curricume.com/privkey.pem;

    location / {
        include                  /etc/nginx/mime.types;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         X-Forwarded-Proto https; # New header for SSL
        proxy_set_header         Host              $http_host;
        proxy_redirect           off;
        proxy_pass               http://localhost:4000;
    }

    access_log /var/log/nginx/thesis-access.log;
    error_log  /var/log/nginx/thesis-error.log;
}

server {
    listen 443 ssl http2;
    server_name cile-server.curricume.com;

    ssl_certificate     /etc/letsencrypt/live/cile.curricume.com/fullchain.pem;     
    ssl_certificate_key /etc/letsencrypt/live/cile.curricume.com/privkey.pem;       

    location / {
        include                  /etc/nginx/mime.types;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         X-Forwarded-Proto https; # New header for SSL
        proxy_set_header         Host              $http_host;
        proxy_redirect           off;
        proxy_pass               http://localhost:8080;
    }

    access_log /var/log/nginx/thesis-access.log;
    error_log  /var/log/nginx/thesis-error.log;

}

server {
    listen 443 ssl http2;
    server_name cile.curricume.com;

    ssl_certificate     /etc/letsencrypt/live/cile.curricume.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cile.curricume.com/privkey.pem;

    location / {
        include                  /etc/nginx/mime.types;
        proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header         X-Forwarded-Proto https; # New header for SSL
        proxy_set_header         Host              $http_host;
        proxy_redirect           off;
