server {

    if ($host = cile.curricume.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cile-server.curricume.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = cile-keycloak.curricume.com) {
        return 301 https://$host$request_uri;
    }


    listen 80;
    server_name cile.curricume.com cile-server.curricume.com cile-keycloak.curricume.com;

}

