services:
  pgdb:
    image: 'postgres:17.7-alpine'
    container_name: pgdb 
    env_file:
      - .env
    ports:
      - "5144:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres_db_backups:/db_backups
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always 
    
  keycloak:
    image: quay.io/keycloak/keycloak
    container_name: cile-keycloak
    command:
      - start-dev
    env_file:
     - .env
    ports:
      - "8081:8080"
    depends_on:
      pgdb:
        condition: service_healthy
    restart: always


  thesis-server:
    container_name: thesis-server
    env_file:
     - .env
    build:
      context: .              
      dockerfile: Dockerfile.server.dev
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app/server
      - /app/server/.gradle
      - ./server/uploads:/app/server/uploads
    depends_on:
      pgdb:
        condition: service_healthy
    restart: always
    # Default: Development mode with hot reloading via Spring Boot DevTools
    # For production: docker-compose stop thesis-server && docker-compose --profile prod up thesis-server-prod

  thesis-server-prod:
    container_name: thesis-server
    env_file:
     - .env
    build:
      context: .              
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    volumes:
      - ./thesis_uploads:/uploads
    depends_on:
      pgdb:
        condition: service_healthy
    restart: always
    profiles:
      - prod
    # Production mode with built JAR
    # Note: Stop thesis-server first if running, then use: docker-compose --profile prod up thesis-server-prod

  thesis-client:
    container_name: thesis-client
    env_file:
     - .env
    build:
      context: .
      dockerfile: Dockerfile.client.dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    restart: always
    # Default: Development mode with hot reloading
    # For production: docker-compose stop thesis-client && docker-compose --profile prod up thesis-client-prod

  thesis-client-prod:
    container_name: thesis-client
    env_file:
     - .env
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "3000:80"
    restart: always
    profiles:
      - prod
    # Production mode with built static files
    # Note: Stop thesis-client first if running, then use: docker-compose --profile prod up thesis-client-prod    
